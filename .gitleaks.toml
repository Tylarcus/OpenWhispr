# Secret-scan rules for this repo. Extends gitleaks defaults; the same rules run locally and in CI.
title = "personal gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
keywords = ["gsk_"]

[[rules]]
id = "signing-password"
description = "Android signing password literal in source"
regex = '''(storePassword|keyPassword)\s*=\s*"[^"\s]{4,}"'''
keywords = ["storepassword", "keypassword"]

# This test-only passphrase is public by design; the actual signing key
# is protected in GitHub Actions and is not committed to the repository.
[[rules.allowlists]]
description = "Ignore ONLY the known local dock-test signing password literal"
regexTarget = "match"
regexes = ['''(storePassword|keyPassword)\s*=\s*"OpenWhisprDockTest2026!"''']


[allowlist]
description = "Placeholders and docs"
regexes = ['''gsk_(…|\.\.\.)''', '''gsk_X+''', '''(storePassword|keyPassword)\s*=\s*"android"''', '''OpenWhisprDockTest2026!''']
# The dock-test password is a known public test-only password; the actual PKCS12
# keystore/private key remains exclusively in the protected GitHub secret.
# Keep flagging all other signing passwords and service API keys.
# Commit that added the old debug signing config (public Android default password "android"); not a secret.
commits = ["49642fae809b05f05ae211cd4b21e8d7492e62da"]

