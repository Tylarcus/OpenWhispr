name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        run: |
          set +e
          gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"
          result=$?
          set -e
          if [ -f "$RUNNER_TEMP/gitleaks-report.json" ]; then
            echo "Redacted findings metadata (rule, file, commit only):"
            jq -r '.[] | [.RuleID, .File, .Commit] | @tsv' \
              "$RUNNER_TEMP/gitleaks-report.json" | sort -u
          fi
          exit "$result"
