name: Gboard Dock Test APK

on:
  push:
    branches:
      - feature/gboard-dock-stable-signing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using runner's sdkmanager
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore permanent private debug signing key
        env:
          DOCK_SIGNING_KEY: ${{ secrets.DOCK_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DOCK_SIGNING_KEY" ]; then
            echo "::error::Set repository secret DOCK_TEST_KEYSTORE_BASE64 before the first upgradeable build"
            exit 1
          fi
          printf '%s' "$DOCK_SIGNING_KEY" | base64 --decode > dock-test-signing.p12
          keytool -list -storetype PKCS12 -keystore dock-test-signing.p12 -alias docktest -storepass 'OpenWhisprDockTest2026!' > /dev/null
          echo "Stable test signing key verified; contents never printed."

      - name: Run microphone placement tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build separately-installable debug APK
        env:
          DOCK_TEST_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: openwhispr-gboard-dock-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish public test-release APK for easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gboard-dock-signed-v1-test" \
            "app/build/outputs/apk/debug/app-debug.apk#OpenWhispr-Gboard-Dock-Signed-Test-v1.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Gboard Dock Signed Test V1 (experimental debug APK)" \
            --notes "Experimental keyboard-docking build. Not tested on physical hardware. Uses applicationId com.edib.openwhispr.docktest, so it does not overwrite the official OpenWhispr app. Disable the original accessibility service while trying the test build." \
            --prerelease \
            --latest=false
