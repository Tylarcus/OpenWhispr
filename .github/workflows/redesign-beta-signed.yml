name: OpenWhispr Redesign Beta Signed APK
on:
  push:
    branches:
      - feature/redesign-word-stats-beta
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore private key
        env:
          TEST_KEY: ${{ secrets.DOCK_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$TEST_KEY"
          printf '%s' "$TEST_KEY" | base64 --decode > dock-test-signing.p12
      - name: Test and build a separate beta package
        env:
          DOCK_TEST_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-beta-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish experimental beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "redesign-beta-${{ github.run_number }}" \
            "app/build/outputs/apk/debug/app-debug.apk#OpenWhispr-Redesign-Beta-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OpenWhispr Redesign Beta #${{ github.run_number }}" \
            --notes "Isolated package com.edib.openwhispr.redesignbeta; does not replace your known-good OpenWhispr app." \
            --prerelease --latest=false
